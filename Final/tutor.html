       <main>
        <h1>Tutor</h1>
        <h2>Reach a tutor for your course</h2>
        <form>
  <label for="name">Name</label>
  <input type="text" id="name" name="name" autocomplete="name" required>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" autocomplete="email" required>

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone" autocomplete="tel">

  <label for="subject">Select the subject</label>
  <select id="subject" name="subject" required>
    <option value="">--Choose a subject--</option>
    <option value="Digital2">Digital Electronics II</option>
    <option value="Analogue2">Analogue Electronics II</option>
    <option value="power1">Power Systems I</option>
    <option value="machines3">Electrical Machines III</option>
    <option value="Network1">Network Analysis I</option>
  </select>

  
    <legend>Reason for Reaching Out</legend>

    <label for="question">
      <input type="radio" id="question" name="reason" value="question">
      Question
    </label>

    <label for="suggestion">
      <input type="radio" id="suggestion" name="reason" value="suggestion">
      Suggestion
    </label>

    <label for="comment">
      <input type="radio" id="comment" name="reason" value="comment">
      Comment
    </label>

    <label for="other">
      <input type="radio" id="other" name="reason" value="other">
      Other
    </label>


  <label for="message">Message</label>
  <textarea id="message" name="message" rows="4"></textarea>

  <button type="submit" class="formBtn">Reach</button>
</form>

       </main>
